<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;font:14px system-ui,"Microsoft JhengHei",sans-serif;color:#202124}
.wrap{width:100%;background:#f7f8fa;border:1px solid #d9dde3;border-radius:10px;padding:10px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:8px}
button{border:1px solid #9aa4b2;background:white;border-radius:7px;padding:7px 12px;cursor:pointer;font-weight:600}
button.primary{background:#1769aa;color:white;border-color:#1769aa}button:disabled{opacity:.45;cursor:not-allowed}
.hint{color:#4b5563;font-size:12px}.stage{width:100%;overflow:hidden;background:#e8ebef;border-radius:6px;display:flex;justify-content:center}
canvas{display:block;max-width:100%;height:auto;touch-action:none;cursor:crosshair}
</style></head><body>
<div class="wrap"><div class="toolbar"><button id="reset">重設偵測四角</button><button id="apply" class="primary">套用目前四角</button><span class="hint">可直接拖曳 1–4 黃色控制點；四點需依左上、右上、右下、左下排列。</span></div><div class="stage"><canvas id="canvas"></canvas></div><div class="hint" id="status">載入照片中…</div></div>
<script>
const canvas=document.getElementById('canvas'),ctx=canvas.getContext('2d');
let img=new Image(),args={},corners=[],initial=[],drag=-1,scale=1,ready=false;
function send(type,fields={}){parent.postMessage({isStreamlitMessage:true,type,...fields},'*')}
function setHeight(){send('streamlit:setFrameHeight',{height:document.body.scrollHeight+8})}
function draw(){if(!ready)return;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(img,0,0,canvas.width,canvas.height);
 const p=corners.map(([x,y])=>[x*scale,y*scale]);ctx.beginPath();ctx.moveTo(...p[0]);for(let i=1;i<4;i++)ctx.lineTo(...p[i]);ctx.closePath();ctx.fillStyle='rgba(255,190,0,.12)';ctx.fill();ctx.strokeStyle='#ff3322';ctx.lineWidth=Math.max(2,canvas.width/700);ctx.stroke();
 p.forEach(([x,y],i)=>{ctx.beginPath();ctx.arc(x,y,Math.max(8,canvas.width/75),0,Math.PI*2);ctx.fillStyle='#ffe600';ctx.fill();ctx.lineWidth=2;ctx.strokeStyle='#111';ctx.stroke();ctx.fillStyle='#111';ctx.font='bold 15px sans-serif';ctx.fillText(String(i+1),x+10,y-10)});
 document.getElementById('status').textContent=`照片尺寸 ${img.naturalWidth} × ${img.naturalHeight} px｜拖曳四角後按「套用目前四角」`;
}
function init(a){args=a;img.onload=()=>{const maxW=Math.min(900,window.innerWidth-40);scale=Math.min(1,maxW/img.naturalWidth);canvas.width=Math.round(img.naturalWidth*scale);canvas.height=Math.round(img.naturalHeight*scale);corners=(a.corners||[]).map(p=>p.slice());initial=(a.initial_corners||a.corners||[]).map(p=>p.slice());ready=true;draw();setHeight()};img.src=a.image_data;}
window.addEventListener('message',e=>{const d=e.data||{};if(d.type==='streamlit:render'){init(d.args||{});}});
canvas.addEventListener('pointerdown',e=>{if(!ready)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;let best=Infinity;corners.forEach((p,i)=>{const dx=p[0]*scale-x,dy=p[1]*scale-y,dist=dx*dx+dy*dy;if(dist<best&&dist<Math.pow(Math.max(24,canvas.width/25),2)){best=dist;drag=i}});if(drag>=0)canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointermove',e=>{if(drag<0)return;const r=canvas.getBoundingClientRect(),x=(e.clientX-r.left)*canvas.width/r.width,y=(e.clientY-r.top)*canvas.height/r.height;corners[drag]=[Math.max(0,Math.min(img.naturalWidth-1,x/scale)),Math.max(0,Math.min(img.naturalHeight-1,y/scale))];draw()});
canvas.addEventListener('pointerup',()=>{drag=-1});canvas.addEventListener('pointercancel',()=>{drag=-1});
document.getElementById('reset').onclick=()=>{corners=initial.map(p=>p.slice());draw()};
document.getElementById('apply').onclick=()=>send('streamlit:setComponentValue',{value:{corners:corners.map(p=>p.map(v=>Math.round(v*100)/100)),image_width:img.naturalWidth,image_height:img.naturalHeight,applied:true}});
send('streamlit:componentReady',{apiVersion:1});
</script></body></html>
